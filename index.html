<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>minimaCore App Store</title>
<style>
  /* Dark "panda" theme — mirrors the native PandaApps store + the PandaDapps landing page. */
  :root{
    --bg:#0b0b0f; --panel:#14141b; --panel2:#1b1b24; --border:#2a2a36;
    --text:#ececef; --dim:#9a9aa8; --accent:#f7931a; --accent-dim:#3a2c12;
    --amber:#e0a93a; --amber-bg:#241d0d; --green:#2ecc71;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  body{
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:900px; margin:0 auto; padding:22px 16px 56px}

  header{display:flex; align-items:center; gap:13px; padding:6px 0 2px}
  .mark{width:44px; height:44px; border-radius:11px; flex:0 0 44px; object-fit:cover; background:var(--panel2)}
  h1{font-size:22px; font-weight:700; letter-spacing:-.01em}
  .sub{color:var(--dim); font-size:13.5px; margin-top:2px}

  /* Store tabs — Android APKs vs the two MiniDapp catalogs. */
  .tabs{display:flex; gap:8px; margin:16px 0 0; flex-wrap:wrap}
  .tab{
    background:var(--panel); color:var(--dim); border:1px solid var(--border);
    border-radius:100px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .tab.active{background:var(--accent); color:#111; border-color:var(--accent)}

  .disclaimer{
    background:var(--amber-bg); border:1px solid var(--amber);
    border-radius:12px; padding:13px 15px; margin:18px 0 6px; font-size:13px; color:#f4e6c6;
  }

  .note{background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:13px 15px; font-size:13px; color:var(--dim); margin:14px 0 4px}
  .note b{color:var(--text)}

  h2{font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim);
     margin:30px 0 11px; font-weight:700}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:15px; display:flex; flex-direction:column; gap:9px;
  }
  .card .top{display:flex; align-items:flex-start; gap:12px}
  .card img.ico,.card .ph{width:52px; height:52px; border-radius:12px; flex:0 0 52px;
     background:var(--panel2); object-fit:cover}
  .card .ph{display:flex; align-items:center; justify-content:center; font-size:23px; color:var(--dim)}
  .card .name{font-weight:700; font-size:15px; line-height:1.25}
  .card .ver{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}
  .card .cat{color:var(--dim); font-size:11px; margin-top:2px; text-transform:uppercase; letter-spacing:.05em}
  .card .desc{color:var(--dim); font-size:12.5px}
  .card .state{color:var(--green); font-size:11px; font-weight:700}
  .btn{
    display:inline-block; text-align:center; text-decoration:none; font-weight:700; font-size:13px;
    border-radius:9px; padding:10px 14px; cursor:pointer; border:1px solid transparent; margin-top:2px;
  }
  .btn-primary{background:var(--accent); color:#111}
  .btn-quiet{background:var(--panel2); color:var(--dim); border-color:var(--border); cursor:default}
  .btn[disabled]{opacity:.55; cursor:default}

  #loading{color:var(--dim); font-size:13.5px; padding:18px 2px}
  #error{display:none; color:#f4c6c6; background:#2a1416; border:1px solid #7a2a2a;
    border-radius:12px; padding:13px 15px; margin:16px 0; font-size:13px}
  #error a{color:var(--accent); font-weight:700; cursor:pointer; text-decoration:underline}

  /* Toast for install feedback (same wording pattern as the PocketWeb store fronts). */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:12px 18px; font-size:13px; max-width:86%;
    box-shadow:0 8px 30px rgba(0,0,0,.5); display:none; z-index:50; text-align:center;
  }
  #toast.ok{border-color:var(--green)}
  #toast.bad{border-color:#7a2a2a}

  footer{margin-top:40px; color:var(--dim); font-size:11.5px; text-align:center; line-height:1.7}
  footer a{color:var(--dim); text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="mark" src="./favicon.png" alt="">
    <div>
      <h1>minimaCore App Store</h1>
      <div class="sub">Native Android apps &amp; MiniDapps for Minima.</div>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <!-- Store-wide disclaimer (populated from the APK catalog's `disclaimer` field; APK tab only). -->
  <div class="disclaimer" id="disclaimer" style="display:none"></div>

  <div class="note" id="note"></div>

  <div id="loading">Loading…</div>
  <div id="error"></div>
  <div id="groups"></div>

  <footer>
    minimaCore App Store · native apps + MiniDapps, by eurobuddha<br>
    Apps are experimental, MIT-licensed, and provided as is — use at your own risk.
  </footer>

</div>
<div id="toast"></div>

<script type="text/javascript" src="mds.js"></script>
<script>
// ─── Sources ─────────────────────────────────────────────────────────────────
// "apk"  → the SAME apks.json the native PandaApps store reads (Download buttons).
// "mds"  → MiniDapp catalogs; these install DIRECTLY onto this node via `mds action:install`.
var SOURCE_ORDER = ["apps", "panda", "official"];
var SOURCES = {
  apps: {
    label: "Android Apps", type: "apk",
    url: "https://raw.githubusercontent.com/eurobuddha/minima-core-apks/main/apks.json",
    note: "<b>Download &amp; install on your Android phone.</b> Tap a <b>Download</b> button — the APK downloads to " +
          "your device; open it to install (allow installs from your browser if Android asks). Grab " +
          "<b>PandaApps</b> first and it will install &amp; auto-update all the others for you."
  },
  panda: {
    label: "PandaDapps", type: "mds",
    url: "https://eurobuddha.com/pandadapps.json",
    note: "<b>MiniDapps install straight onto this node.</b> Tap <b>Install</b> — your node downloads the dapp " +
          "and it appears in your MiniHub. If Minima asks, approve the command in the <b>Pending</b> MiniDapp."
  },
  official: {
    label: "Minima Dapps", type: "mds",
    url: "https://eurobuddha.com/store/minimadapps.json",
    note: "<b>Official Minima MiniDapps, installed straight onto this node.</b> Tap <b>Install</b> — your node " +
          "downloads the dapp and it appears in your MiniHub. If Minima asks, approve the command in the " +
          "<b>Pending</b> MiniDapp."
  }
};

// Groups for the APK tab, in the same order/labels as the native PandaApps app (MainActivity.render).
var GROUPS = [
  { title: "YOUR APPS",       match: function (s) { return s === "PandaApps"; } },
  { title: "OFFICIAL MINIMA", match: function (s) { return s === "Official"; } },
  { title: "MORE",            match: function (s) { return s !== "PandaApps" && s !== "Official"; } }
];

var current = "apps";
var cache = {};            // source id -> parsed catalog
var installed = null;      // lowercase dapp name -> installed version (from `mds`)
var toastTimer = null;

function el(id) { return document.getElementById(id); }

// Best-effort parse of an MDS.net.GET response into a JS object (string / base64 / {data} / object).
function netBody(res) {
  if (!res || res.status === false) return null;
  var b = res.response;
  if (b && typeof b === "object" && b.data != null) b = b.data;
  if (typeof b === "string") {
    try { return JSON.parse(b); } catch (e) { try { return JSON.parse(atob(b)); } catch (e2) { return null; } }
  }
  return (b && typeof b === "object") ? b : null;
}

function ph(ch) { var d = document.createElement("div"); d.className = "ph"; d.textContent = ch || "◈"; return d; }

function toast(msg, ok) {
  var t = el("toast");
  t.textContent = msg;
  t.className = ok ? "ok" : "bad";
  t.style.display = "block";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 5000);
}

// ─── Tabs ────────────────────────────────────────────────────────────────────
function buildTabs() {
  var host = el("tabs");
  host.innerHTML = "";
  SOURCE_ORDER.forEach(function (id) {
    var b = document.createElement("button");
    b.className = "tab" + (id === current ? " active" : "");
    b.textContent = SOURCES[id].label;
    b.onclick = function () { if (current !== id) { current = id; buildTabs(); show(); } };
    host.appendChild(b);
  });
}

function show() {
  el("error").style.display = "none";
  el("groups").innerHTML = "";
  el("note").innerHTML = SOURCES[current].note;
  el("disclaimer").style.display = "none";
  if (cache[current]) { render(); return; }
  load();
}

function load() {
  el("loading").style.display = "block";
  var src = SOURCES[current];
  var forId = current;
  MDS.net.GET(src.url, function (res) {
    var data = netBody(res);
    if (!data) { if (forId === current) showError("Could not reach the catalog (network)."); return; }
    cache[forId] = data;
    if (forId === current) render();
  });
}

function render() {
  el("loading").style.display = "none";
  el("error").style.display = "none";
  if (SOURCES[current].type === "apk") renderApks(cache[current]);
  else renderDapps(cache[current]);
}

function showError(extra) {
  el("loading").style.display = "none";
  var e = el("error");
  e.innerHTML = (extra ? (extra + " ") : "Could not load the catalog. ") + '<a id="retry">Try again</a>.';
  e.style.display = "block";
  var r = document.getElementById("retry");
  if (r) r.onclick = function () { delete cache[current]; show(); };
}

// ─── APK tab (unchanged behaviour: grouped cards with Download links) ────────
function apkCard(app) {
  var c = baseCard(app, app.category);
  if (app.file) {
    var dl = document.createElement("a");
    dl.className = "btn btn-primary";
    dl.href = app.file;
    dl.target = "_blank";
    dl.rel = "noopener";
    dl.setAttribute("download", "");
    // .apk = install on Android; .dmg/.exe = desktop download.
    var f = String(app.file).toLowerCase();
    dl.textContent = (f.indexOf(".dmg") >= 0 || f.indexOf(".exe") >= 0) ? "Download" : "Download APK";
    c.appendChild(dl);
  }
  return c;
}

function renderApks(data) {
  var apps = (data && Array.isArray(data.apps)) ? data.apps : [];
  var disc = data && data.disclaimer;
  if (disc) { var d = el("disclaimer"); d.textContent = disc; d.style.display = "block"; }

  var host = el("groups");
  host.innerHTML = "";
  if (!apps.length) { showError("The catalog is empty right now."); return; }

  GROUPS.forEach(function (g) {
    var members = apps.filter(function (a) { return g.match(a.source || ""); });
    if (!members.length) return;
    var h = document.createElement("h2"); h.textContent = g.title; host.appendChild(h);
    var grid = document.createElement("div"); grid.className = "cards";
    members.forEach(function (a) { grid.appendChild(apkCard(a)); });
    host.appendChild(grid);
  });
}

// ─── MiniDapp tabs (Install straight onto this node) ─────────────────────────
// The official minimadapps.json sometimes has `description` as an ARRAY of strings — normalize.
function descText(d) {
  if (Array.isArray(d)) d = d.join(" ");
  return d ? String(d).replace(/\s+/g, " ").trim() : "";
}

function verCmp(a, b) {   // 1 if a>b, -1 if a<b, 0 equal — numeric dotted compare
  var pa = String(a || "0").split("."), pb = String(b || "0").split(".");
  var n = Math.max(pa.length, pb.length);
  for (var i = 0; i < n; i++) {
    var x = parseInt(pa[i] || "0", 10) || 0, y = parseInt(pb[i] || "0", 10) || 0;
    if (x !== y) return x > y ? 1 : -1;
  }
  return 0;
}

function baseCard(item, catText) {
  var c = document.createElement("div"); c.className = "card";
  var top = document.createElement("div"); top.className = "top";
  if (item.icon) {
    var img = document.createElement("img"); img.className = "ico"; img.src = item.icon; img.alt = "";
    img.onerror = function () { img.replaceWith(ph("◈")); };
    top.appendChild(img);
  } else {
    top.appendChild(ph("◈"));
  }
  var meta = document.createElement("div");
  var nm = document.createElement("div"); nm.className = "name"; nm.textContent = item.name || "App";
  meta.appendChild(nm);
  var ve = document.createElement("div"); ve.className = "ver";
  ve.textContent = item.version ? ("v" + item.version) : "";
  meta.appendChild(ve);
  if (catText) { var ct = document.createElement("div"); ct.className = "cat"; ct.textContent = catText; meta.appendChild(ct); }
  top.appendChild(meta);
  c.appendChild(top);

  var d = descText(item.description);
  if (d) { var de = document.createElement("div"); de.className = "desc"; de.textContent = d; c.appendChild(de); }
  return c;
}

function dappCard(dapp) {
  var c = baseCard(dapp, dapp.category);

  // Installed state from the node's own `mds` list (matched by dapp.conf name, best effort).
  var have = installed ? installed[String(dapp.name || "").toLowerCase()] : undefined;
  var isInstalled = have !== undefined;
  var hasUpdate = isInstalled && dapp.version && verCmp(dapp.version, have) > 0;

  if (isInstalled) {
    var st = document.createElement("div"); st.className = "state";
    st.textContent = hasUpdate ? ("Installed v" + have + " · update available") : "Installed ✓";
    c.appendChild(st);
  }

  var btn = document.createElement("button");
  if (dapp.file) {
    if (isInstalled && !hasUpdate) {
      btn.className = "btn btn-quiet";
      btn.textContent = "Installed";
      btn.disabled = true;
    } else {
      btn.className = "btn btn-primary";
      btn.textContent = hasUpdate ? "Update" : "Install";
      btn.setAttribute("data-label", btn.textContent);
      btn.onclick = function () { installDapp(dapp, btn); };
    }
    c.appendChild(btn);
  }
  return c;
}

function renderDapps(data) {
  var dapps = Array.isArray(data) ? data : ((data && Array.isArray(data.dapps)) ? data.dapps : []);
  var host = el("groups");
  host.innerHTML = "";
  if (!dapps.length) { showError("The catalog is empty right now."); return; }

  var sorted = dapps.slice().sort(function (a, b) {
    return String(a.name || "").toLowerCase().localeCompare(String(b.name || "").toLowerCase());
  });
  var h = document.createElement("h2");
  h.textContent = SOURCES[current].label + " · " + sorted.length + " MiniDapps";
  host.appendChild(h);
  var grid = document.createElement("div"); grid.className = "cards";
  sorted.forEach(function (d) { grid.appendChild(dappCard(d)); });
  host.appendChild(grid);
}

// Download the .mds.zip via the node, then `mds action:install` it. The download response
// (FILEcommand.java) saves to /Downloads/<name> and returns `path` = the FULL filesystem path —
// use that directly; fall back to getpath on the returned relative `file` ("/Downloads/…").
// With read-only MDS permission the command lands in Pending for the user to approve —
// same flow the PocketWeb store fronts use.
function installDapp(dapp, btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = "Installing…";
  MDS.file.download(dapp.file, function (res) {
    if (!res || res.status === false) { installFail(dapp, btn, "the download failed"); return; }
    var full = "", rel = "";
    try {
      full = res.response.download.path || "";
      rel  = res.response.download.file || "";
    } catch (e) {}
    if (full) { runInstall(dapp, btn, full); return; }
    if (!rel) rel = "/Downloads/" + String(dapp.file).split("/").pop().split("?")[0];
    if (rel.charAt(0) !== "/") rel = "/" + rel;
    MDS.file.getpath(rel, function (p) {
      var path = "";
      try { path = p.response.getpath.path || ""; } catch (e) {}
      if (!p || p.status === false || !path) { installFail(dapp, btn, "couldn't locate the downloaded file"); return; }
      runInstall(dapp, btn, path);
    });
  });
}

function runInstall(dapp, btn, path) {
  MDS.cmd("mds action:install file:" + path + " trust:read", function (r) {
    if (r && r.pending) {
      btn.textContent = "Pending…";
      toast(dapp.name + " sent to Pending — approve it in the Pending MiniDapp, then it appears in your MiniHub.", true);
    } else if (r && r.status) {
      btn.textContent = "Installed";
      btn.className = "btn btn-quiet";
      if (installed) installed[String(dapp.name || "").toLowerCase()] = String(dapp.version || "");
      toast(dapp.name + " installed — it's now in your MiniHub.", true);
    } else {
      installFail(dapp, btn, (r && (r.error || r.message)) || "the install failed");
    }
  });
}

function installFail(dapp, btn, why) {
  btn.disabled = false;
  btn.textContent = btn.getAttribute("data-label") || "Install";
  toast("Couldn't install " + dapp.name + " — " + why + ". Try again.", false);
}

// Ask the node what's already installed so cards can show Installed / Update. Best effort:
// if the command is refused (read-only permission), everything just shows Install.
function loadInstalled(cb) {
  MDS.cmd("mds", function (res) {
    var map = {};
    try {
      var list = (res && res.response && res.response.minidapps) || [];
      for (var i = 0; i < list.length; i++) {
        var conf = list[i].conf || {};
        if (conf.name) map[String(conf.name).toLowerCase()] = String(conf.version || "");
      }
    } catch (e) {}
    installed = map;
    cb();
  });
}

MDS.init(function (msg) {
  if (msg.event === "inited") {
    buildTabs();
    loadInstalled(function () { show(); });
  }
});
</script>
</body>
</html>
